<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Student Management</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>Student Management</h1>
<p class="sub">Java MVC + JDBC + MySQL</p>

<form id="studentForm">
<input id="name" placeholder="Student name" required>
<input id="course" placeholder="Course" required>
<input id="email" type="email" placeholder="Email" required>
<button type="submit">Add Student</button>
</form>

<h2>Students</h2>
<table><thead><tr><th>ID</th><th>Name</th><th>Course</th><th>Email</th><th>Action</th></tr></thead>
<tbody id="studentList"></tbody></table>
</div>
<script src="script.js"></script>
</body>
</html>
